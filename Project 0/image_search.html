<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Images</title>
		<link rel="stylesheet" href="style.css">
	</head>
	
	<body class="image-search-page">

		<nav class="navbar">
			<ul class="nav-list">
				<li><a href="index.html" class="nav-link">Back to Search</a></li>
			</ul>
		</nav>


		<input type="checkbox" id="toggle-modal" hidden>

        <div>
            <center class="vertical-center">
                <h1>
                    <span class="g">G</span>
                    <span class="o1">o</span>
                    <span class="o2">o</span>

				  	</div>
			  
				  	<div class="divider">

				  	</div>
			  
				  	<div class="link-search">

				</div>
			</div>
			  

	    	</center>
