<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="styles.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Sans:bold">
        <style>
            body {
                text-align: center;
                margin-top: 20%;
            }

            h1 {
                font-family: 'Google Sans Code', sans-serif; /* Apply the Google Font */
                font-size: 50px;
            }

            .top-right-buttons {
                position: absolute;
                top: 10px;
                right: 10px; 
                display: flex;
                flex-direction: row;
                gap: 10px;           
            }

        </style>
    </head>

    <body>
        <h1>Google</h1>
        <form action="https://google.com/search">
            <input type="text" placeholder="Search" name="q">
            <input type="submit" value="Google Search">
        </form>

        <div class="top-right-buttons">
            <form action="https://image.google.com/">
                <input type="submit" value="Google Image Search">
            </form>

            <form action="https://www.google.com/advanced_search">
                <input type="submit" value="Google Advanced Search">
            </form>
        </div>
    </body>

</html>
